[project]
name = "ashley-web"
version = "0.1.0"
description = "Ash's personal portfolio and services webpage"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "jinja2>=3.1.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ashley-web = "ashley_web.__main__:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.102",
]

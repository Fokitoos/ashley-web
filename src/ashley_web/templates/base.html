<!doctype html>
<html lang="en" data-gradient="{{ site.gradient }}" style="--accent: {{ site.accent }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }} Yoga{% endblock %}</title>
<meta name="description" content="Yoga, gatherings and therapeutic movement with {{ site.name }}, in {{ site.city }} and online.">
<link rel="preload" href="{{ url_for('static', path='fonts/jost-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url_for('static', path='fonts/cormorant-garamond-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}?v={{ asset_version('css/site.css') }}">
{% block head %}{% endblock %}
<script type="module" src="{{ url_for('static', path='js/site.js') }}?v={{ asset_version('js/site.js') }}"></script>
</head>
<body>
<div class="page">
{% block content %}{% endblock %}
</div>
</body>
</html>

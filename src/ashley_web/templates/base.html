<!doctype html>
<html lang="en" data-gradient="{{ site.gradient }}" style="--accent: {{ site.accent }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }} Yoga{% endblock %}</title>
<meta name="description" content="Yoga, gatherings and therapeutic movement with {{ site.name }}, in {{ site.city }} and online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}">
<script type="module" src="{{ url_for('static', path='js/site.js') }}"></script>
</head>
<body>
<div class="page">
{% block content %}{% endblock %}
</div>
</body>
</html>
